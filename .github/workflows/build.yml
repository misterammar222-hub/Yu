name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project File
      run: |
        unzip -o FIREOS-Android-Project_sign.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for Gradle wrapper
      run: |
        find extracted_project -name "gradlew" -exec chmod +x {} \;

    - name: Build Universal Debug APK
      run: |
        GRADLE_DIR=$(find extracted_project -name "gradlew" | head -n 1 | xargs dirname)
        cd "$GRADLE_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fireos-debug-apk
        path: extracted_project/**/build/outputs/apk/debug/*.apk
