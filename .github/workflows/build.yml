name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project File
      run: |
        mkdir -p extracted_project
        unzip -o FIREOS-Android-Project_sign.zip -d extracted_project

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Locate Build File and Build APK
      run: |
        # Find directory containing build.gradle
        BUILD_FILE=$(find extracted_project -name "settings.gradle" -o -name "build.gradle" | head -n 1)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "Error: No build.gradle found in zip!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Building project in: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fireos-debug-apk
        path: extracted_project/**/build/outputs/apk/**/*.apk
