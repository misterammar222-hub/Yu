name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Unzip Project File
        run: |
          unzip project.zip -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x extracted_project/FIREOS/gradlew

      - name: Build Universal Debug APK
        run: |
          cd extracted_project/FIREOS
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: fireos-debug-apk
          path: extracted_project/FIREOS/app/build/outputs/apk/debug/app-debug.apk
