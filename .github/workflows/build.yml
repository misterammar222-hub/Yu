name: Build APK from Zip

on:
    push:
        branches: [ main, master ]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Unzip Project File
          run: |
            mkdir -p extracted_project
            unzip -o FIREOS-Android-Project_sign.zip -d extracted_project
            echo "--- Contents of extracted_project ---"
            ls -R extracted_project

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
              distribution: 'temurin'
              java-version: '17'

        - name: Locate Gradle Wrapper and Build APK
          run: |
            # Search for gradlew path dynamically
            GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
            
            if [ -z "$GRADLEW_PATH" ]; then
              echo "Error: gradlew file not found!"
              exit 1
            fi
            
            echo "Found gradlew at: $GRADLEW_PATH"
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            echo "Gradle directory is: $GRADLE_DIR"
            
            # Grant execution permission
            chmod +x "$GRADLEW_PATH"
            
            # Move to the project directory and build
            cd "$GRADLE_DIR"
            ./gradlew assembleDebug

        - name: Upload APK Artifact
          uses: actions/upload-artifact@v4
          with:
              name: fireos-debug-apk
              path: extracted_project/**/build/outputs/apk/debug/*.apk
